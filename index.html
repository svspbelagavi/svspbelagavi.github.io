    <!-- ─────────────────────── SPA redirect helper (GitHub Pages) ───────────────────────
       When GitHub Pages serves our custom 404.html, that page redirects here with
       the original path encoded as `?/<path>`. Decode it back to a real URL so the
       client router picks it up correctly. Must run BEFORE the React bundle.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
